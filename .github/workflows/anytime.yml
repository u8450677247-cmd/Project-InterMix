name: anytime-android

on:
  push:
    branches: ["feature/anytime-*"]
    paths: ["anytime/**", ".github/workflows/anytime.yml"]
  pull_request:
    paths: ["anytime/**", ".github/workflows/anytime.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anytime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Install Android API 36
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_dir="$sdk_root/cmdline-tools/latest/bin"
          test -x "$sdkmanager_dir/sdkmanager"
          echo "$sdkmanager_dir" >> "$GITHUB_PATH"
          "$sdkmanager_dir/sdkmanager" --licenses < <(yes 2>/dev/null) >/dev/null
          "$sdkmanager_dir/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Public source audit
        run: python tools/public_release_audit.py .
      - name: Domain, Android unit tests and debug APK
        run: gradle -p anytime :calendar-domain:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --stacktrace
      - name: Detect persistent dogfood signing key
        id: dogfood
        env:
          PRIVATE_KEY: ${{ secrets.ANICLOUD_DOGFOOD_PRIVATE_KEY_B64 }}
          CERTIFICATE: ${{ secrets.ANICLOUD_DOGFOOD_CERTIFICATE_B64 }}
        run: |
          if [[ -n "$PRIVATE_KEY" && -n "$CERTIFICATE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign persistent Anytime dogfood APK
        if: steps.dogfood.outputs.available == 'true'
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.ANICLOUD_DOGFOOD_PRIVATE_KEY_B64 }}
          CERTIFICATE: ${{ secrets.ANICLOUD_DOGFOOD_CERTIFICATE_B64 }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d "$RUNNER_TEMP/anytime-signing.XXXXXX")"
          trap 'rm -f "$temporary/private.pk8" "$temporary/certificate.pem"; rmdir "$temporary"' EXIT
          printf '%s' "$PRIVATE_KEY" | base64 --decode > "$temporary/private.pk8"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$temporary/certificate.pem"
          chmod 600 "$temporary/private.pk8" "$temporary/certificate.pem"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          signer="$sdk_root/build-tools/36.0.0/apksigner"
          output="$GITHUB_WORKSPACE/anytime/app/build/outputs/apk/dogfood"
          mkdir -p "$output"
          "$signer" sign --key "$temporary/private.pk8" --cert "$temporary/certificate.pem" \
            --out "$output/Anytime-dogfood.apk" \
            "$GITHUB_WORKSPACE/anytime/app/build/outputs/apk/debug/app-debug.apk"
          "$signer" verify --verbose --print-certs "$output/Anytime-dogfood.apk"
          (cd "$output" && sha256sum Anytime-dogfood.apk > Anytime-dogfood.apk.sha256)
          printf '%s\n' "$GITHUB_SHA" > "$output/commit.txt"
      - name: Retain installable Anytime APK
        uses: actions/upload-artifact@v7
        with:
          name: Anytime-standalone-debug
          path: anytime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain persistent Anytime dogfood APK
        if: steps.dogfood.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Anytime-standalone-dogfood
          path: |
            anytime/app/build/outputs/apk/dogfood/Anytime-dogfood.apk
            anytime/app/build/outputs/apk/dogfood/Anytime-dogfood.apk.sha256
            anytime/app/build/outputs/apk/dogfood/commit.txt
          if-no-files-found: error
          retention-days: 30
