<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Intermix</title>
  <desc id="desc">Project Intermix with a cyan Sovereign Core, radiant purple AniCloudAI interface, and magenta frontier signal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030711"/>
      <stop offset="0.50" stop-color="#091126"/>
      <stop offset="1" stop-color="#18051f"/>
    </linearGradient>
    <radialGradient id="coreBloom" cx="0" cy="0" r="1" gradientTransform="translate(110 150) rotate(90) scale(178 260)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25F4FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#25F4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="appBloom" cx="0" cy="0" r="1" gradientTransform="translate(650 130) rotate(90) scale(220 470)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#A855FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="futureBloom" cx="0" cy="0" r="1" gradientTransform="translate(1100 150) rotate(90) scale(180 280)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameSignal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25F4FF"/>
      <stop offset="0.52" stop-color="#A855FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#6a7d9d" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#coreBloom)"/>
  <rect width="1200" height="300" rx="24" fill="url(#appBloom)"/>
  <rect width="1200" height="300" rx="24" fill="url(#futureBloom)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <path d="M44 42H1156M44 258H1156" stroke="url(#frameSignal)" stroke-width="2" opacity="0.82"/>
  <g transform="translate(92 150)" fill="none" stroke="#25F4FF" filter="url(#glow)">
    <circle r="68" stroke-width="2" opacity="0.48"/>
    <circle r="46" stroke-width="3" opacity="0.72"/>
    <path d="M-78 0H78M0-78V78" stroke-width="1" opacity="0.34"/>
    <path d="M-32-16L0-36l32 20v32L0 36l-32-20z" stroke-width="4"/>
    <circle r="8" fill="#25F4FF" stroke="none"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="208" y="122" fill="#e7edf5" font-size="52" font-weight="700" letter-spacing="4">PROJECT INTERMIX</text>
    <text x="212" y="166" font-size="17" font-weight="700" letter-spacing="2.5"><tspan fill="#25F4FF">SOVEREIGN CORE</tspan><tspan fill="#72809a"> · </tspan><tspan fill="#A855FF">ANICLOUDAI NATIVE</tspan><tspan fill="#72809a"> · </tspan><tspan fill="#FF2BD6">TENSOR FRONTIER</tspan></text>
    <text x="212" y="207" fill="#aeb9cb" font-size="16" letter-spacing="2">PUBLIC ALPHA 1.4.1 · ANDROID / TERMUX REFERENCE BUILD</text>
  </g>
  <g transform="translate(1012 150)" fill="none" stroke-linecap="round">
    <path d="M-64 0h26l14-28 20 56 18-38 14 10h36" stroke="#FF2BD6" stroke-width="4" filter="url(#glow)"/>
    <circle cx="-64" cy="0" r="4" fill="#A855FF" stroke="none"/>
    <circle cx="64" cy="0" r="4" fill="#FF2BD6" stroke="none"/>
  </g>
</svg>
